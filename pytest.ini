[pytest]
# pytest 配置
# 默认运行：跳过 distributed / gpu / slow 测试
# 跑全部：pytest -m "" (空 marker)
# 跑 distributed：pytest -m distributed
# 跑 gpu：pytest -m gpu
# 跑 mock only：pytest -m "not distributed and not gpu"

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认 marker
markers =
    distributed: mark test as requiring multi-process distributed execution
    gpu: mark test as requiring GPU (deferred until GPU available)
    slow: mark test as slow (deselect with '-m "not slow"')

# 默认不显示 warning（CI 友好）
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 收集阶段
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not gpu"
